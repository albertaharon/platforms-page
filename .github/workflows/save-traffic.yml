name: Save Traffic Stats
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  save:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and save traffic data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)

          RESPONSE=$(curl -s -H "Authorization: token $TRAFFIC_TOKEN" \
            https://api.github.com/repos/albertaharon/platforms-page/traffic/views)

          VIEWS=$(echo "$RESPONSE" | jq -r ".views[] | select(.timestamp | startswith(\"$DATE\")) | .count" 2>/dev/null | head -1)
          UNIQUES=$(echo "$RESPONSE" | jq -r ".views[] | select(.timestamp | startswith(\"$DATE\")) | .uniques" 2>/dev/null | head -1)

          echo "$DATE,${VIEWS:-0},${UNIQUES:-0}" >> traffic-log.csv
          sort -u -t',' -k1,1 traffic-log.csv -o traffic-log.csv

          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add traffic-log.csv
          git diff --cached --quiet || git commit -m "Daily traffic: $DATE"
          git push
